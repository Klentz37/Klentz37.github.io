<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport"
          content="width=device-width,
                   height=device-height,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>Dinos Klentzeris</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #231F20;
            touch-action: none;
        }
    </style>
</head>

<body>

<canvas id="unity-canvas" tabindex="-1"></canvas>

<script src="Build/Website.loader.js"></script>

<script>
createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: "Build/Website.data",
    frameworkUrl: "Build/Website.framework.js",
    codeUrl: "Build/Website.wasm",
    streamingAssetsUrl: "StreamingAssets",

    companyName: "Klentz37 Studios",
    productName: "GitHubWebsite",
    productVersion: "0.4",

    matchWebGLToCanvasSize: true
}).catch((message) => {
    alert(message);
});
</script>

</body>
</html>
